    <p style="font-size:.95rem;color:#555;line-height:1.7;margin-bottom:.75rem;">
      Tu reserva no fue confirmada. No se realizó ningún cobro.
    </p>
    <p style="font-size:.85rem;color:#999;margin-bottom:2.5rem;">
