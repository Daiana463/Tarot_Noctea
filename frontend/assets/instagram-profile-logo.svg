<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="igBg" cx="50%" cy="46%" r="52%">
      <stop offset="0%"   stop-color="#1a4d2e"/>
      <stop offset="60%"  stop-color="#061A12"/>
      <stop offset="100%" stop-color="#020d07"/>
    </radialGradient>
    <linearGradient id="igLeaf" x1="0%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#2F6B3C"/>
      <stop offset="100%" stop-color="#0d2d17"/>
    </linearGradient>
    <linearGradient id="igLeaf2" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#3a7e4a"/>
      <stop offset="100%" stop-color="#163826"/>
    </linearGradient>
    <radialGradient id="igAmb" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2F6B3C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2F6B3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="igGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="igGlowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Fondo cuadrado negro para Instagram -->
  <rect width="500" height="500" fill="#061A12"/>

  <!-- Glow ambiental -->
  <circle cx="250" cy="250" r="240" fill="url(#igAmb)" filter="url(#igGlowSoft)"/>

  <!-- Círculo de fondo principal -->
  <circle cx="250" cy="250" r="210" fill="url(#igBg)"/>

  <!-- Anillos dorados externos -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#C9A85A" stroke-width="2.2" opacity="0.55"/>
  <circle cx="250" cy="250" r="196" fill="none" stroke="#C9A85A" stroke-width="0.7" stroke-dasharray="5 8" opacity="0.28"/>
  <circle cx="250" cy="250" r="178" fill="none" stroke="#C9A85A" stroke-width="0.5" opacity="0.12"/>

  <!-- Geometría sagrada sutil -->
  <polygon points="250,52 257,182 372,250 257,318 250,448 243,318 128,250 243,182"
    fill="none" stroke="#C9A85A" stroke-width="0.6" opacity="0.12"/>
  <g stroke="#C9A85A" stroke-width="0.4" opacity="0.07">
    <line x1="250" y1="40" x2="250" y2="460"/>
    <line x1="40" y1="250" x2="460" y2="250"/>
    <line x1="102" y1="102" x2="398" y2="398"/>
    <line x1="398" y1="102" x2="102" y2="398"/>
  </g>

  <!-- Luna creciente -->
  <circle cx="250" cy="155" r="48" fill="#C9A85A" opacity="0.04" filter="url(#igGlowSoft)"/>
  <circle cx="250" cy="155" r="44" fill="none" stroke="#C9A85A" stroke-width="1.4" opacity="0.6"/>
  <circle cx="250" cy="155" r="40" fill="#C9A85A" opacity="0.08"/>
  <circle cx="272" cy="147" r="34" fill="#061A12"/>
  <circle cx="250" cy="155" r="52" fill="none" stroke="#C9A85A" stroke-width="0.4" opacity="0.18"/>

  <!-- Botánica izquierda -->
  <path d="M38 500 Q60 430 55 360 Q48 295 68 238 Q82 196 70 145"
    fill="none" stroke="#2F6B3C" stroke-width="2.5" stroke-linecap="round" opacity="0.82"/>
  <path d="M57 380 Q28 360 16 326"
    fill="none" stroke="#2F6B3C" stroke-width="1.5" stroke-linecap="round" opacity="0.70"/>
  <ellipse cx="10" cy="314" rx="20" ry="34" fill="url(#igLeaf)" transform="rotate(-42 10 314)" opacity="0.86"/>
  <ellipse cx="26" cy="335" rx="11" ry="19" fill="url(#igLeaf2)" transform="rotate(-28 26 335)" opacity="0.65"/>
  <path d="M62 308 Q32 286 24 252"
    fill="none" stroke="#2F6B3C" stroke-width="1.3" stroke-linecap="round" opacity="0.62"/>
  <ellipse cx="18" cy="240" rx="17" ry="30" fill="url(#igLeaf)" transform="rotate(-52 18 240)" opacity="0.80"/>
  <ellipse cx="32" cy="256" rx="9" ry="16" fill="#0e2e18" transform="rotate(-36 32 256)" opacity="0.52"/>
  <path d="M66 250 Q40 222 42 190"
    fill="none" stroke="#2F6B3C" stroke-width="1.1" stroke-linecap="round" opacity="0.54"/>
  <ellipse cx="40" cy="178" rx="15" ry="26" fill="url(#igLeaf)" transform="rotate(-48 40 178)" opacity="0.75"/>
  <ellipse cx="66" cy="220" rx="7" ry="12" fill="url(#igLeaf2)" transform="rotate(15 66 220)" opacity="0.40"/>

  <!-- Botánica derecha -->
  <path d="M462 500 Q440 430 445 360 Q452 295 432 238 Q418 196 430 145"
    fill="none" stroke="#2F6B3C" stroke-width="2.2" stroke-linecap="round" opacity="0.72"/>
  <path d="M443 380 Q472 360 484 326"
    fill="none" stroke="#2F6B3C" stroke-width="1.4" stroke-linecap="round" opacity="0.66"/>
  <ellipse cx="490" cy="314" rx="18" ry="31" fill="url(#igLeaf)" transform="rotate(42 490 314)" opacity="0.82"/>
  <ellipse cx="474" cy="333" rx="10" ry="17" fill="url(#igLeaf2)" transform="rotate(27 474 333)" opacity="0.62"/>
  <path d="M438 308 Q468 286 476 252"
    fill="none" stroke="#2F6B3C" stroke-width="1.2" stroke-linecap="round" opacity="0.58"/>
  <ellipse cx="482" cy="240" rx="15" ry="27" fill="url(#igLeaf)" transform="rotate(52 482 240)" opacity="0.76"/>
  <path d="M434 250 Q460 222 458 190"
    fill="none" stroke="#2F6B3C" stroke-width="1.0" stroke-linecap="round" opacity="0.50"/>
  <ellipse cx="458" cy="178" rx="13" ry="23" fill="url(#igLeaf)" transform="rotate(45 458 178)" opacity="0.70"/>

  <!-- Acento botánico superior -->
  <path d="M226 72 Q232 52 240 46 Q243 58 234 74" fill="url(#igLeaf)" opacity="0.50"/>
  <path d="M274 72 Q268 52 260 46 Q257 58 266 74" fill="url(#igLeaf)" opacity="0.50"/>
  <line x1="250" y1="68" x2="250" y2="44" stroke="#2F6B3C" stroke-width="1" opacity="0.28"/>

  <!-- Estrellas -->
  <circle cx="176" cy="124" r="2.5" fill="#C9A85A" opacity="0.55"/>
  <circle cx="324" cy="130" r="2" fill="#C9A85A" opacity="0.48"/>
  <circle cx="138" cy="200" r="1.5" fill="#C9A85A" opacity="0.42"/>
  <circle cx="362" cy="206" r="2" fill="#C9A85A" opacity="0.44"/>
  <circle cx="122" cy="280" r="1.5" fill="#C9A85A" opacity="0.32"/>
  <circle cx="378" cy="272" r="1.5" fill="#C9A85A" opacity="0.32"/>
  <path d="M160,160 L161.2,155.5 L162.4,160 L167,161.2 L162.4,162.4 L161.2,167 L160,162.4 L155.4,161.2 Z" fill="#C9A85A" opacity="0.45"/>
  <path d="M340,168 L341,164 L342,168 L346,169 L342,170 L341,174 L340,170 L336,169 Z" fill="#C9A85A" opacity="0.40"/>

  <!-- Texto NOCTEA -->
  <ellipse cx="250" cy="262" rx="95" ry="30" fill="#030e09" opacity="0.55"/>
  <line x1="180" y1="236" x2="320" y2="236" stroke="#C9A85A" stroke-width="0.7" opacity="0.35"/>
  <text x="250" y="263"
    text-anchor="middle"
    font-family="Georgia, 'Palatino Linotype', Palatino, serif"
    font-size="42"
    font-weight="400"
    letter-spacing="10"
    fill="#C9A85A"
    opacity="0.92">NOCTEA</text>
  <circle cx="212" cy="274" r="1.5" fill="#C9A85A" opacity="0.35"/>
  <circle cx="288" cy="274" r="1.5" fill="#C9A85A" opacity="0.35"/>
  <text x="250" y="292"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="13"
    font-weight="400"
    letter-spacing="6"
    fill="#C9A85A"
    opacity="0.44">· tarot ·</text>
  <line x1="180" y1="302" x2="320" y2="302" stroke="#C9A85A" stroke-width="0.7" opacity="0.35"/>

  <!-- Puntos de anclaje en el anillo principal -->
  <g fill="#C9A85A" opacity="0.38">
    <circle cx="250" cy="40"  r="3"/>
    <circle cx="250" cy="460" r="2.5"/>
    <circle cx="40"  cy="250" r="2.5"/>
    <circle cx="460" cy="250" r="2.5"/>
    <circle cx="101" cy="101" r="2"/>
    <circle cx="399" cy="101" r="2"/>
    <circle cx="101" cy="399" r="1.8"/>
    <circle cx="399" cy="399" r="1.8"/>
  </g>

  <!-- Viñeta final -->
  <radialGradient id="igVig" cx="50%" cy="50%" r="50%">
    <stop offset="55%" stop-color="#061A12" stop-opacity="0"/>
    <stop offset="100%" stop-color="#061A12" stop-opacity="0.28"/>
  </radialGradient>
  <circle cx="250" cy="250" r="210" fill="url(#igVig)"/>
</svg>
